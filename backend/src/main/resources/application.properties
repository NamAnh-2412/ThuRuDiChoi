app.pin.pepper=${PIN_PEPPER:thu-ru-di-choi-dev-pin-pepper}
app.pin.max-failed-attempts=5
app.pin.lock-minutes=15
app.pin.max-attempts-per-ip=20
app.special-token.secret=${SPECIAL_TOKEN_SECRET:thu-ru-di-choi-dev-special-token-secret}
app.special-token.ttl-minutes=120
app.admin.username=admin
app.admin.password=193850091011
app.cors.origins=http://localhost:5173,http://127.0.0.1:5173
